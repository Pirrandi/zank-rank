# zank.rank self-hosted: `cp .env.example .env`, completar, y `docker compose up -d`.
# - app: web (next start) en ${PORT:-3000}. Al arrancar crea/actualiza la DB en el volumen.
# - scheduler: poll cada POLL_INTERVAL_MINUTES y análisis diario a las ANALYZE_HOUR (TZ).
# Los datos viven en el volumen `zank-data` (/data/zank.db).

x-zank: &zank
  build: .
  image: zank-rank:local
  env_file: .env
  environment:
    DATABASE_URL: file:/data/zank.db
    TZ: ${TZ:-UTC}
  volumes:
    - zank-data:/data
  restart: unless-stopped
  init: true

services:
  app:
    <<: *zank
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scheduler:
    <<: *zank
    entrypoint: ["./node_modules/.bin/tsx", "scripts/scheduler.ts"]
    # Espera a que `app` haya creado el schema antes del primer poll.
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  zank-data:
